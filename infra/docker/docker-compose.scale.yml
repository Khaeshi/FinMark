version: '3.8'

# FinMark Scaling Demonstration
# Shows active scaling: 3 report-svc instances behind nginx load balancer
# Run: docker compose -f infra/docker/docker-compose.scale.yml up
# Then run k6 against http://localhost (nginx on port 80 → scaled api-gateway)

services:

  # ─── Nginx Load Balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - cdn_cache_dir:/var/cache/nginx
    networks:
      - finmark-net
    restart: always

  # ─── API Gateway — 2 instances ────────────────────────────────────────────
  api-gateway-1:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - PORT=4000
      # development so /api/auth/dev-login + JWT soft-verify work for the k6 demo
      - NODE_ENV=development
      - INSTANCE_ID=api-gateway-1
      - USER_AUTH_SVC_URL=http://user-auth-svc:4001
      - ORDER_SVC_URL=http://nginx:4002      
      - REPORT_SVC_URL=http://nginx:4003     
      - PRODUCT_SVC_URL=http://nginx:4004    
      - ADMIN_SVC_URL=http://admin-svc:4005
      - FEEDBACK_SVC_URL=http://feedback-svc:4006
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway-2:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - PORT=4000
      - NODE_ENV=development
      - INSTANCE_ID=api-gateway-2
      - USER_AUTH_SVC_URL=http://user-auth-svc:4001
      - ORDER_SVC_URL=http://nginx:4002     
      - REPORT_SVC_URL=http://nginx:4003     
      - PRODUCT_SVC_URL=http://nginx:4004   
      - ADMIN_SVC_URL=http://admin-svc:4005
      - FEEDBACK_SVC_URL=http://feedback-svc:4006
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Report Service — 3 instances ─────────────────────────────────────────
  report-svc-1:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-1
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  report-svc-2:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-2
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  report-svc-3:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-3
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Other Services — single instance ─────────────────────────────────────
  user-auth-svc:
    build:
      context: ../..
      dockerfile: services/user-auth-svc/Dockerfile
    environment:
      - PORT=4001
      # enables POST /dev-login (disabled when NODE_ENV=production)
      - NODE_ENV=development
    env_file: ../../.env
    networks:
      - finmark-net

  # ─── Order Service — 2 Passively Balanced Backup Instances ────────────────
  order-svc-1:
    build:
      context: ../..
      dockerfile: services/order-svc/Dockerfile
    environment:
      - PORT=4002
      - NODE_ENV=production
      - INSTANCE_ID=order-svc-1
    env_file: ../../.env
    networks:
      - finmark-net

  order-svc-2:
    build:
      context: ../..
      dockerfile: services/order-svc/Dockerfile
    environment:
      - PORT=4002
      - NODE_ENV=production
      - INSTANCE_ID=order-svc-2
    env_file: ../../.env
    networks:
      - finmark-net

  admin-svc:
    build:
      context: ../..
      dockerfile: services/admin-svc/Dockerfile
    environment:
      - PORT=4005
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  feedback-svc:
    build:
      context: ../..
      dockerfile: services/feedback-svc/Dockerfile
    environment:
      - PORT=4006
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  # ─── Product Service — 2 Active/Active Instances ──────────────────────────
  product-svc-1:
    build:
      context: ../..
      dockerfile: services/product-svc/Dockerfile
    environment:
      - PORT=4004
      - NODE_ENV=production
      - INSTANCE_ID=product-svc-1
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  product-svc-2:
    build:
      context: ../..
      dockerfile: services/product-svc/Dockerfile
    environment:
      - PORT=4004
      - NODE_ENV=production
      - INSTANCE_ID=product-svc-2
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Monitoring ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - finmark-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=finmark123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - finmark-net

networks:
  finmark-net:
    driver: bridge

volumes:
  cdn_cache_dir: