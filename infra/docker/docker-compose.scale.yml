version: '3.8'

# FinMark Scaling Demonstration
# Shows active scaling: 3 report-svc instances behind nginx load balancer
# Run: docker compose -f infra/docker/docker-compose.scale.yml up
# Then run k6 against http://localhost:4000

services:

  # ─── Nginx Load Balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway-1
      - api-gateway-2
    networks:
      - finmark-net

  # ─── API Gateway — 2 instances ────────────────────────────────────────────
  api-gateway-1:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - PORT=4000
      - NODE_ENV=production
      - INSTANCE_ID=api-gateway-1
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway-2:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - PORT=4000
      - NODE_ENV=production
      - INSTANCE_ID=api-gateway-2
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Report Service — 3 instances (most critical for dashboard) ───────────
  report-svc-1:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-1
    env_file: ../../.env
    networks:
      - finmark-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  report-svc-2:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-2
    env_file: ../../.env
    networks:
      - finmark-net

  report-svc-3:
    build:
      context: ../..
      dockerfile: services/report-svc/Dockerfile
    environment:
      - PORT=4003
      - NODE_ENV=production
      - INSTANCE_ID=report-svc-3
    env_file: ../../.env
    networks:
      - finmark-net

  # ─── Other Services — single instance ─────────────────────────────────────
  user-auth-svc:
    build:
      context: ../..
      dockerfile: services/user-auth-svc/Dockerfile
    environment:
      - PORT=4001
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  order-svc:
    build:
      context: ../..
      dockerfile: services/order-svc/Dockerfile
    environment:
      - PORT=4002
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  admin-svc:
    build:
      context: ../..
      dockerfile: services/admin-svc/Dockerfile
    environment:
      - PORT=4005
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  feedback-svc:
    build:
      context: ../..
      dockerfile: services/feedback-svc/Dockerfile
    environment:
      - PORT=4006
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

  product-svc:
    build:
      context: ../..
      dockerfile: services/product-svc/Dockerfile
    environment:
      - PORT=4004
      - NODE_ENV=production
    env_file: ../../.env
    networks:
      - finmark-net

networks:
  finmark-net:
    driver: bridge
