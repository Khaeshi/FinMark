# FinMark nginx for Docker Swarm
# One upstream hostname per service — Swarm DNS load-balances across replicas.
# Resolver re-queries tasks when replicas scale up/down.

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;

        location /nginx-health {
            return 200 '{"status":"healthy","service":"nginx-swarm-lb"}';
            add_header Content-Type application/json;
        }

        location /health {
            set $gw "api-gateway:4000";
            proxy_pass         http://$gw;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/ {
            set $gw "api-gateway:4000";
            proxy_pass         http://$gw;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
