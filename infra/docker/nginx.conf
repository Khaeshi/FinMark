events {
    worker_connections 1024;
}

http {
    # ─── Local CDN Cache Path Setup ──────────────────────────────────────────
    # Sets up a 10MB memory zone for metadata and allows up to 1GB of cache files
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # ─── Upstream — API Gateway Cluster (2 instances) ────────────────────────
    upstream api_gateway {
        least_conn;  # Routes to the instance with the fewest active connections
        server api-gateway-1:4000;
        server api-gateway-2:4000;
    }

    # ─── Upstream — Report Service Cluster (Active/Active) ───────────────────
    upstream report_svc {
        least_conn;
        server report-svc-1:4003 max_fails=1 fail_timeout=10s;
        server report-svc-2:4003 max_fails=1 fail_timeout=10s;
        server report-svc-3:4003 max_fails=1 fail_timeout=10s;
    }

    # ─── Upstream — Order Service Cluster (Active/Passive Backup) ────────────
    upstream order_cluster {
        server order-svc-1:4002;
        server order-svc-2:4002 backup; # Passive sleep state until instance 1 drops
    }

    # ─── Upstream — Product Service Cluster (Active/Active) ──────────────────
    upstream product_cluster {
        least_conn; # Evenly distributes traffic weight between both instances
        server product-svc-1:4004;
        server product-svc-2:4004;
    }


    # ─── PUBLIC MAIN REVERSE PROXY GATEWAY (Port 80) ─────────────────────────
    server {
        listen 80;

        # Health check for Nginx load balancer itself
        location /nginx-health {
            return 200 '{"status":"healthy","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        # Simulated CDN Edge Cache Layer: Global Health Route
        location /health {
            proxy_pass         http://api_gateway;
            
            # Activate the local CDN simulator
            proxy_cache        cdn_cache;
            proxy_cache_valid  200 10m; # Cache successful hits for 10 minutes
            proxy_cache_valid  401 2m;
            
            # Presentation Proof Header: Displays HIT or MISS in terminal curl traces
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # All standard incoming load test traffic -> Forwarded to API Gateways
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            # Retry on public gateway failures — key for fault tolerance demo
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
        }
    }


    # ─── INTERNAL SERVICE LISTENER: REPORT SERVICE (Port 4003) ───────────────
    server {
        listen 4003;
        error_log /var/log/nginx/error.log warn; 

        location / {
            proxy_pass         http://report_svc;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';
            
            # Dynamic failover routing rules if a report service container goes down
            proxy_connect_timeout     2s;
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }


    # ─── INTERNAL SERVICE LISTENER: ORDER SERVICE (Port 4002) ────────────────
    server {
        listen 4002;

        location / {
            proxy_pass         http://order_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            # Instant hot-standby failover parameters
            proxy_connect_timeout     2s;
            proxy_next_upstream       error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }


    # ─── INTERNAL SERVICE LISTENER: PRODUCT SERVICE (Port 4004) ──────────────
    server {
        listen 4004;

        location / {
            proxy_pass         http://product_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            # Active cluster traffic failure parameters
            proxy_connect_timeout     2s;
            proxy_read_timeout        10s;
            proxy_next_upstream       error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
