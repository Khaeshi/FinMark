events {
    worker_connections 1024;
}

http {
    # ─── Upstream — API Gateway (2 instances) ────────────────────────────────
    upstream api_gateway {
        least_conn;  # route to instance with fewest active connections
        server api-gateway-1:4000;
        server api-gateway-2:4000;
    }

    # ─── Upstream — Report Service (3 instances) ─────────────────────────────
    upstream report_svc {
        least_conn;
        server report-svc-1:4003;
        server report-svc-2:4003;
        server report-svc-3:4003;
    }

    # ─── Main Server ──────────────────────────────────────────────────────────
    server {
        listen 80;

        # health check for nginx itself
        location /nginx-health {
            return 200 '{"status":"healthy","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        # all API traffic → api-gateway cluster
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            # timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            # retry on failure — key for fault tolerance demo
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
        }

        # health check passthrough
        location /health {
            proxy_pass http://api_gateway;
        }
    }
}
